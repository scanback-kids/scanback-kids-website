<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Return item | ScanBack Kids</title><style>body{font-family:Arial;background:#f5f7fb;padding:18px;color:#182230}.card{max-width:550px;margin:25px auto;background:white;padding:24px;border-radius:18px}label{display:block;font-weight:bold;margin:12px 0 6px}input,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccd2dc;border-radius:9px;font-size:16px}button{width:100%;padding:13px;margin-top:12px;border:0;border-radius:9px;background:#175cd3;color:white;font-weight:bold}.secondary{background:#eef2f6;color:#182230}.notice{background:#fff8e1;padding:12px;border-radius:10px;font-size:14px;line-height:1.5}.muted{color:#667085;font-size:14px}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body><section class="card"><h1>🎒 Help return this item</h1><p id="info">Checking sticker…</p><div class="notice"><b>Optional location:</b> If you choose to share your location, your current coordinates will be sent to the registered owner to help return the item. You can send a report without location.</div><label>Your name (optional)</label><input id="name" placeholder="e.g. school staff"><label>Message (optional)</label><textarea id="message" rows="3" placeholder="I found this item near…"></textarea><button onclick="send(true)">Share location & send report</button><button class="secondary" onclick="send(false)">Send report without location</button><p id="status" class="muted"></p></section><script>
const id=new URLSearchParams(location.search).get("id");let sb;
function init(){let c=window.SCANBACK_CONFIG;if(!c.SUPABASE_URL.startsWith("https://")||c.SUPABASE_URL.includes("PASTE_")){document.getElementById("info").textContent="This service is not configured yet.";return}sb=window.supabase.createClient(c.SUPABASE_URL,c.SUPABASE_ANON_KEY);if(!id){document.getElementById("info").textContent="Invalid sticker link.";return}sb.functions.invoke("public-item",{body:{id}}).then(({data,error})=>{document.getElementById("info").innerHTML=error||!data?.item?"Sticker not found or inactive.":"Registered item: <b>"+esc(data.item.child_name)+"'s "+esc(data.item.item_name)+"</b>. Thank you for helping!"})}
function send(want){if(!sb||!id)return;const submit=coords=>sb.functions.invoke("submit-scan",{body:{item_id:id,finder_name:document.getElementById("name").value.trim(),message:document.getElementById("message").value.trim(),location_shared:!!coords,consent_location:!!coords,latitude:coords?.latitude??null,longitude:coords?.longitude??null,accuracy:coords?.accuracy??null}}).then(({data,error})=>document.getElementById("status").textContent=error?"Report could not be sent. Please try again.":(data?.message||"Report sent. Thank you!"));if(!want)return submit(null);if(!navigator.geolocation){document.getElementById("status").textContent="Location unavailable. You can send without location.";return}document.getElementById("status").textContent="Your browser will ask whether to share location.";navigator.geolocation.getCurrentPosition(p=>submit({latitude:p.coords.latitude,longitude:p.coords.longitude,accuracy:p.coords.accuracy}),()=>document.getElementById("status").textContent="Location not shared. You can send without location.",{enableHighAccuracy:true,timeout:12000,maximumAge:0})}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}init();
</script></body></html>
