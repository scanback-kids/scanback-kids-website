name: V6.15 design-specific geometry preflight
on:
  pull_request:
    paths:
      - 'print-renderer/v615_96_geometry_registry.json'
      - 'print-renderer/verify_96_geometry_registry.py'
      - 'docs/development-artwork-audit/v615-candidate-manifest.json'
      - '.github/workflows/v615-geometry-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geometry-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check 96 design identities and fail-closed geometry schema
        run: python3 print-renderer/verify_96_geometry_registry.py --output geometry-preflight-report.json
      - name: Save geometry readiness audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v615-geometry-preflight
          path: geometry-preflight-report.json
          if-no-files-found: ignore
