name: V6.15 artwork inventory preflight
on:
  pull_request:
    paths:
      - 'assets/print-masters/**'
      - 'docs/development-artwork-audit/v615-candidate-manifest.json'
      - 'print-renderer/verify_96_artwork_inventory.py'
      - '.github/workflows/v615-artwork-inventory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-artwork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify 96 artwork IDs, paths, WebP headers and SHA-256 hashes
        run: python3 print-renderer/verify_96_artwork_inventory.py --output artwork-inventory-qa.json
      - name: Store audit JSON
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v615-artwork-inventory-qa
          path: artwork-inventory-qa.json
          if-no-files-found: ignore
