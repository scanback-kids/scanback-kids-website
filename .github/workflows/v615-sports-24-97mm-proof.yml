name: V6.15 Sports 24 exact-composite PDF QR proof gate
on:
  pull_request:
    paths:
      - 'print-renderer/sports-v615/sports-designs/**'
      - 'print-renderer/sports-v615/sports_v615_renderer_97mm_locked_layout_QA.py'
      - 'print-renderer/sports-v615/sports_sha256_manifest.json'
      - '.github/workflows/v615-sports-24-97mm-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sports-24-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Require 24 exact archived original composite PNG binaries and matching SHA256
        run: python print-renderer/verify_v615_sports_first_batches.py --output qa-output/sports-24-source-gate.json --require-sports-composites
      - name: Install reproducible PDF and QR dependencies
        run: python -m pip install 'Pillow==11.3.0' 'numpy==2.2.6' 'opencv-python-headless==4.12.0.88' 'qrcode==8.2' 'PyMuPDF==1.26.5' 'reportlab==4.4.4'
      - name: Render full 24 source-locked 97mm QA proof and scan at 300 DPI
        run: python print-renderer/sports-v615/sports_v615_renderer_97mm_locked_layout_QA.py --include-provisional --name KRISHNAANSH --item 'Water Bottle' --output out/sports_24_97mm_QA.pdf
      - name: Recheck 24 QR scans and internal minimum printed module pitch
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("print-renderer/sports-v615/out/sports_24_97mm_QA.json")
          x=json.loads(p.read_text())
          assert x["total"]==24 and x["passed"]==24 and not x["failed"],x
          assert all(r["qr_module_mm"]>=0.30 for r in x["records"])
          assert all(all(t.get("fits",t.get("blank",False)) for t in r["text_checks"]) for r in x["records"])
          print("PASS 24/24 digital PDF QR and text fit, synthetic QR only; no commercial approval.")
          PY
      - name: Upload development proofs (not production release)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v615-sports-24-97mm-digital-QA
          path: |
            qa-output/sports-24-source-gate.json
            print-renderer/sports-v615/out/sports_24_97mm_QA.pdf
            print-renderer/sports-v615/out/sports_24_97mm_QA.json
          if-no-files-found: ignore
