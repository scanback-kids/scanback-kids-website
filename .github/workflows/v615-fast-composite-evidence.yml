name: V6.15 fast exact composite evidence
on:
  pull_request:
    paths:
      - 'assets/print-masters/**'
      - 'print-renderer/ScanBack_V6_15/**'
      - 'print-renderer/v615_legacy_geometry_*.json'
      - 'print-renderer/check_96_exact_composite_matches.py'
      - '.github/workflows/v615-fast-composite-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install 'Pillow==11.3.0'
      - name: Compare 96 catalog images to 20 exact V6.15 composite pixels
        run: python print-renderer/check_96_exact_composite_matches.py --output qa-output/v615-fast-exact-matches.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: v615-96-exact-composite-evidence
          path: qa-output/v615-fast-exact-matches.json
          if-no-files-found: error
