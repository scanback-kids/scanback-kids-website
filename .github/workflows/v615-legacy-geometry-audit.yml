name: V6.15 legacy geometry evidence audit
on:
  pull_request:
    paths:
      - 'print-renderer/v615_legacy_geometry_*.json'
      - 'print-renderer/verify_20_legacy_geometry.py'
      - 'print-renderer/ScanBack_V6_15/**'
      - '.github/workflows/v615-legacy-geometry-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Pillow for offline source-image dimensions
        run: python3 -m pip install 'Pillow==11.3.0'
      - name: Verify original master dimensions and 20 per-master text/QR coordinates
        run: python3 print-renderer/verify_20_legacy_geometry.py --output v615-legacy-coordinate-audit.json
      - name: Upload reproducible source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v615-20-original-geometry-audit
          path: v615-legacy-coordinate-audit.json
          if-no-files-found: ignore
